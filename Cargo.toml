[package]
name = "age-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A native Rust desktop companion for age encryption"
license = "BSD-3-Clause"
default-run = "age-desktop"

[dependencies]
iced = { version = "=0.14.0", features = ["tokio", "advanced", "svg", "sysinfo"] }
shadcn-iced = "=0.3.0"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tempfile = "3"
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "age-desktop"
path = "src/main.rs"
